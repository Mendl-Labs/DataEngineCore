[package]
name = "hostbuilder"
version = "0.1.1"
edition = "2021"

[features]
default = ["database"]
database = ["diesel", "diesel-async", "databaseschema"]

[dependencies]
anyhow = "1.0.86"
async-trait = "0.1.80"
base64 = "0.22.1"
bigdecimal = { version = "0.4.5", features = ["serde"] }
config = { path = "../config" }
chrono = { version = "0.4.19", features = ["serde"] }
derivatives = { path = "../../BacktestingCore/derivatives" }
databaseschema = { path = "../../databaseschema", optional = true }
ultra-logger = { path = "../../LoggingEngine/ultra-logger" }
deadpool = "0.12.1"
diesel = { version = "2.3.8", features = ["chrono", "uuid", "numeric"], optional = true }
diesel-async = { version = "0.7.0", features = ["deadpool", "postgres"], optional = true }
dotenv = "0.15.0"
futures-util = "0.3.30"
hmac = "0.12.1"
mockall = "0.12.1"
performance = { path = "../performance" }
publisher = { path = "../../MessageBrokerEngine/publisher" }
subscriber = { path = "../../MessageBrokerEngine/subscriber" }
protocol = { path = "../../MessageBrokerEngine/protocol" }
prost = "0.13"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = { version = "1.0.117", features = ["arbitrary_precision", "raw_value"] }
sha2 = "0.10.8"
sysinfo = "0.30"
tokio = { version = "1.38.0", features = ["full"] }
tokio-retry = "0.3.0"
tokio-tungstenite = { version = "0.23.1", features = ["native-tls"] }
url = "2.5.2"

# Enhanced security dependencies
jsonwebtoken = "9.3"
validator = { version = "0.19", features = ["derive"] }
rand = "0.8"
hex = "0.4"
toml = "0.8"
uuid = { version = "1.10.0", features = ["serde", "v4"] }
serde_yaml = "0.9.34"
# High-performance additions
simd-json = "0.13"
ahash = "0.8"
smallvec = { version = "1.11", features = ["serde"] }
dashmap = "5.5"
socket2 = "0.5"
# Ultra-high performance allocator
mimalloc = { version = "0.1", default-features = false }
# Lock-free data structures
crossbeam = "0.8"
# Required dependencies that were missing
once_cell = "1.19"
parking_lot = "0.12"
fastrand = "2.0"
num_cpus = "1.16"
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
crossbeam-utils = "0.8"
regex = "1.10"
thiserror = "1.0"
libc = "0.2"
cache-padded = "1.3"
wide = "0.7"
heapless = "0.8"
# URL encoding for Tardis Machine WebSocket
urlencoding = "2.1"

# Windows-specific dependencies
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.48", features = ["Win32_System_Threading"] }
crossbeam-channel = "0.5"
winapi = { version = "0.3", features = ["processthreadsapi", "winnt"] }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.6"

[build-dependencies]
prost-build = "0.13.1"
