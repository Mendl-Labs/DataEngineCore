[package]
name = "performance"
version = "0.1.0"
edition = "2021"
description = "Ultra-high performance optimization modules for DataEngine"

[dependencies]
# Core async runtime
tokio = { version = "1.0", features = ["full"] }

# High-performance concurrency
parking_lot = "0.12"
crossbeam = "0.8"
rayon = "1.7"

# Memory management
once_cell = "1.19"
dashmap = "5.5"
anyhow = "1.0"
crossbeam-utils = "0.8"

# Ultra-high performance logging
ultra-logger = { path = "../../LoggingEngine/ultra-logger" }

# System APIs
libc = "0.2"
num_cpus = "1.16"

# Windows-specific
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "winbase", "processthreadsapi", "winnt", "handleapi",
    "synchapi", "memoryapi", "sysinfoapi"
] }

# Performance monitoring
[dependencies.serde]
version = "1.0"
features = ["derive"]

[lib]
name = "performance"
crate-type = ["rlib"]

[features]
default = ["metrics", "cpu_affinity", "memory_pools", "simd"]
metrics = []
cpu_affinity = []
memory_pools = []
simd = []
ultra_mode = ["metrics", "cpu_affinity", "memory_pools", "simd"]
